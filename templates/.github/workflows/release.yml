# Release Workflow - Unified Template
# Triggers on version tags (v*.*.*) and creates GitHub releases
# Includes Cosign signing and post-release verification
#
# Placeholders: __PROJECT_NAME__, __MAIN_PACKAGE_SUFFIX__
# __MAIN_PACKAGE_SUFFIX__: path after the module for go install, WITH its leading slash
# (e.g., "/cmd/git-herd", or empty for a root main package) — it is pasted directly
# after the module path here and in .goreleaser.yaml's release footer.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

# Read-only by default (the verify job needs that much for `gh release view`);
# the release job asks for its write scopes itself, so verify holds no write
# token and no OIDC identity.
permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # GitHub's default is six hours. This is a cap, not an estimate: it stops a
    # hung QEMU build or registry push from holding the runner that long.
    timeout-minutes: 60
    permissions:
      contents: write  # create the GitHub release and upload its assets
      packages: write  # push the image to GHCR
      id-token: write  # keyless cosign signing and npm --provenance
    # Mapped here, not on the steps that use it: `if: env.X != ''` is evaluated
    # before a step's own `env:` exists, so a step-level mapping never sees it.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A manual dispatch names the tag; on a tag push this is the tag itself.
          # Without it a dispatch built the branch HEAD, and goreleaser refused the
          # untagged commit.
          ref: ${{ inputs.tag || github.ref }}
          # Nothing here pushes to this repository: goreleaser publishes through the
          # API with GITHUB_TOKEN and the tap tokens, and AUR over SSH with AUR_KEY.
          # A persisted credential would only sit in .git/config for dist/ to leak.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No cache on a release: it would restore module and build caches written
          # by other runs (any branch that ran CI), so a poisoned cache entry would
          # end up compiled into signed release binaries.
          cache: false

      - name: Run tests
        run: |
          go mod download
          go mod verify
          go test -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
          platforms: linux/amd64,linux/arm64

      - name: Verify buildx setup
        run: docker buildx ls

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # The action's default (1.51.1) predates the fix for GHSA-mw2c-m758-9v5q.
          syft-version: v1.52.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's default (v3.0.6) predates the fix for GHSA-fx35-mq7g-6g98.
          cosign-release: v3.1.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_TAP_TOKEN: ${{ secrets.SCOOP_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      # ---------------------------------------------------------------------
      # npm distribution - conditional on NPM_TOKEN
      #
      # Runs here rather than in its own job because it needs dist/, which only
      # exists in this runner. Skips with a warning when the secret is absent,
      # like every other optional channel.
      # ---------------------------------------------------------------------
      - name: Set up Node
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # Would switch on by itself if the project's package.json names npm as its
          # packageManager; same reason as setup-go above.
          package-manager-cache: false

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node npm/prepare.mjs "$TAG"
          cd npm
          # A prerelease publishes under its channel (1.2.0-beta.1 -> beta), never
          # under `latest`, which is what every `npm i -g` resolves.
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) PRERELEASE="${VERSION#*-}"; DIST_TAG="${PRERELEASE%%.*}" ;;
            *) DIST_TAG=latest ;;
          esac
          # --provenance ties the tarball to this workflow run. It needs the
          # id-token: write permission declared on this job.
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Note the skipped npm publish
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set - skipping the npm publish"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30

  verify:
    name: Verify Release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for release propagation
        run: sleep 30

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This job checks what users get from `go install`; a build cache from
          # other runs would test that instead. (There is no checkout, so no go.sum
          # to key a cache on either.)
          cache: false

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking release for tag: $TAG"
          gh release view "$TAG" --repo "$REPO"

      - name: Test installation (Go)
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          go install "github.com/${REPO}__MAIN_PACKAGE_SUFFIX__@${TAG}"
          __PROJECT_NAME__ --version

      - name: Test Docker image
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # GHCR image names are lowercase; github.repository keeps the org's case.
          IMAGE="ghcr.io/${REPO,,}:${VERSION}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --version
