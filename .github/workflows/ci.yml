# CI Workflow - Unified Template
# Runs tests, linting, security scanning, build verification, and GoReleaser snapshot
#
# Placeholders: __PROJECT_NAME__, __MAIN_PACKAGE__

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.27.0"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The commit-msg hook in .pre-commit-config.yaml runs on developer machines, where it can
  # be bypassed with --no-verify and never sees the one subject that matters most: a squash
  # merge takes its subject from the pull request title, and that title is what GoReleaser
  # groups into the changelog. This job runs the very same hook, with the same args, so
  # there is one definition of a valid subject rather than two that can drift.
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the branch range below needs both endpoints

      - name: Install pre-commit
        run: pipx install pre-commit

      # Titles and subjects reach the shell through env and a file, never through ${{ }}
      # interpolation: both are attacker-controlled text on a fork's pull request.
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/subject.txt"
          pre-commit run conventional-pre-commit \
            --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/subject.txt"

      - name: Lint the commits on the branch
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while IFS= read -r subject; do
            printf '%s\n' "$subject" > "$RUNNER_TEMP/subject.txt"
            pre-commit run conventional-pre-commit \
              --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/subject.txt" || status=1
          done < <(git log --no-merges --format=%s "$RANGE")
          exit "$status"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          VERSION="dev-${GIT_SHA}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build -v -trimpath \
            -ldflags="-X main.version=${VERSION} -X main.date=${BUILD_DATE} -X main.commit=${GIT_COMMIT} -X main.builtBy=ci" \
            -o __PROJECT_NAME__ \
            __MAIN_PACKAGE__

      - name: Verify binary
        run: |
          ./__PROJECT_NAME__ --version
          ./__PROJECT_NAME__ --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: __PROJECT_NAME__-linux-amd64
          path: __PROJECT_NAME__
          retention-days: 7

  goreleaser:
    name: GoReleaser Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Check config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Test snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # A snapshot has no OIDC identity for keyless cosign to sign with.
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
